{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BurgerHouse{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'assets/css/style.css' %}">
</head>
<body class="bg-dark-900 text-slate-50 font-outfit antialiased">

    <nav class="fixed w-full z-40 glass top-0 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <a href="/" class="flex items-center gap-2">
                    <div class="w-10 h-10 rounded-full bg-primary-500 flex items-center justify-center text-white font-bold">
                        <i class="fas fa-hamburger"></i>
                    </div>
                    <span class="font-bold text-2xl text-white">Burger<span class="text-primary-500">House</span></span>
                </a>
                <div class="hidden md:flex items-center space-x-8">
                    <a href="/" class="text-primary-500 font-medium hover:text-primary-400">Asosiy</a>
                    <a href="#menu" class="text-gray-300 hover:text-white font-medium">Menu</a>
                </div>
                <div class="hidden md:flex items-center space-x-4">
                    {% if request.user.is_authenticated %}
                        <a href="{% url 'profile' %}" class="text-gray-300 hover:text-white">
                            <i class="fas fa-user-circle text-2xl"></i>
                        </a>
                        <a href="{% url 'logout' %}" class="bg-red-500 hover:bg-red-600 text-white px-5 py-2 rounded-full font-medium">Chiqish</a>
                    {% else %}
                        <a href="{% url 'login' %}" class="text-gray-300 hover:text-white font-medium">Kirish</a>
                        <a href="{% url 'register' %}" class="bg-primary-500 hover:bg-primary-600 text-white px-5 py-2 rounded-full font-medium">Ro'yxatdan o'tish</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    {% block content %}
    {% endblock %}

    <footer class="bg-dark-900 border-t border-white/10 py-10 mt-10">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-gray-500">&copy; 2024 BurgerHouse. Barcha huquqlar himoyalangan.</p>
        </div>
    </footer>

    <script src="{% static 'assets/js/main.js' %}"></script>
</body>
</html>

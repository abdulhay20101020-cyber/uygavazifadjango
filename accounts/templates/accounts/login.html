{% extends 'base.html' %}

{% block title %}Kirish{% endblock %}

{% block content %}

<section class="pt-32 pb-20">
    <div class="max-w-md mx-auto px-4">
        <div class="glass-card rounded-2xl p-8">
            <h2 class="text-3xl font-bold text-white mb-8 text-center">Kirish</h2>
            <form method="POST" class="space-y-4">
                {% csrf_token %}
                <div>
                    <label class="text-gray-400 text-sm mb-1 block">Username</label>
                    <input type="text" name="username"
                        class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-primary-500"
                        placeholder="Username">
                </div>
                <div>
                    <label class="text-gray-400 text-sm mb-1 block">Parol</label>
                    <input type="password" name="password"
                        class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-primary-500"
                        placeholder="Parol">
                </div>
                <button type="submit" class="w-full bg-primary-500 hover:bg-primary-600 text-white py-3 rounded-xl font-semibold transition mt-4">
                    Kirish
                </button>
            </form>
            <p class="text-gray-400 text-center mt-4">
                Akkaunt yo'qmi? <a href="{% url 'register' %}" class="text-primary-500 hover:text-primary-400">Ro'yxatdan o'tish</a>
            </p>
        </div>
    </div>
</section>

{% endblock %}

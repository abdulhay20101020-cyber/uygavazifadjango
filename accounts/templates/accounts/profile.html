{% extends 'base.html' %}

{% block title %}Profil{% endblock %}

{% block content %}

<section class="pt-32 pb-20">
    <div class="max-w-md mx-auto px-4">
        <div class="glass-card rounded-2xl p-8 text-center">
            <div class="w-24 h-24 rounded-full bg-primary-500 flex items-center justify-center text-white text-4xl mx-auto mb-6">
                <i class="fas fa-user"></i>
            </div>
            <h2 class="text-3xl font-bold text-white mb-2">{{ request.user.username }}</h2>
            <p class="text-gray-400 mb-8">{{ request.user.email }}</p>
            <a href="{% url 'logout' %}" class="bg-red-500 hover:bg-red-600 text-white px-8 py-3 rounded-full font-semibold transition">
                <i class="fas fa-sign-out-alt mr-2"></i> Chiqish
            </a>
        </div>
    </div>
</section>

{% endblock %}

{% extends 'base.html' %}

{% block title %}Ro'yxatdan o'tish{% endblock %}

{% block content %}

<section class="pt-32 pb-20">
    <div class="max-w-md mx-auto px-4">
        <div class="glass-card rounded-2xl p-8">
            <h2 class="text-3xl font-bold text-white mb-8 text-center">Ro'yxatdan o'tish</h2>
            <form method="POST" class="space-y-4">
                {% csrf_token %}
                {% for field in form %}
                <div>
                    <label class="text-gray-400 text-sm mb-1 block">{{ field.label }}</label>
                    <input type="{{ field.field.widget.input_type }}" name="{{ field.html_name }}"
                        class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-primary-500"
                        placeholder="{{ field.label }}">
                    {% if field.errors %}
                        <p class="text-red-400 text-sm mt-1">{{ field.errors.0 }}</p>
                    {% endif %}
                </div>
                {% endfor %}
                <button type="submit" class="w-full bg-primary-500 hover:bg-primary-600 text-white py-3 rounded-xl font-semibold transition mt-4">
                    Ro'yxatdan o'tish
                </button>
            </form>
            <p class="text-gray-400 text-center mt-4">
                Akkaunt bormi? <a href="{% url 'login' %}" class="text-primary-500 hover:text-primary-400">Kirish</a>
            </p>
        </div>
    </div>
</section>

{% endblock %}
